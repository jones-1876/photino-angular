<main class="shell">
  <header>
    <h1>{{ title() }}</h1>
    <p class="host" [class.host--offline]="!photino.available">
      {{ photino.available ? 'Running in the Photino window' : 'Running in a plain browser (no host bridge)' }}
    </p>
  </header>

  <section class="bridge">
    <h2>Host bridge</h2>
    <button type="button" (click)="ping()" [disabled]="!photino.available">Ping the .NET host</button>
    @if (photino.messages().length) {
      <ul>
        @for (message of photino.messages(); track $index) {
          <li>{{ message }}</li>
        }
      </ul>
    } @else {
      <p class="empty">No replies yet.</p>
    }
  </section>

  <router-outlet />
</main>
